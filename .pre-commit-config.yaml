exclude: (^|.*/)migrations/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Docker Compose custom tags (!override, !reset, etc.)
        args: [--unsafe]
      - id: name-tests-test
        args: [--pytest-test-first]
        # Shared fixtures/utilities are not test modules (hook matches all tests/**/*.py).
        exclude: ^(tests/helpers/|tests/e2e/auth_headers\.py$|tests/e2e/graphql/legacy_auth\.py$|tests/e2e/graphql/graphql_auth\.py$)
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: fix-byte-order-marker
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: "(^migrations/|^tests/|^\\.github/|^bruno/|^\\.env\\.example$)"
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        exclude: (.*/models/__init__\.py$|^generated/)
      - id: ruff-format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
  # Heavy checks run on push so day-to-day commits stay fast.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^app/
        args: ["-r", "app", "-c", "pyproject.toml", "-ll"]
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        files: ^app/
        additional_dependencies:
          - strawberry-graphql>=0.323.0,<0.324.0
          - pydantic>=2
          - pydantic-settings
        args: ["--exclude", "^generated/", "."]
        pass_filenames: false
        stages: [pre-push]
  - repo: local
    hooks:
      - id: env-example-sync
        name: .env.example documents every setting
        entry: poetry run python scripts/check_env_example_sync.py
        language: system
        pass_filenames: false
        files: ^(\.env\.example|app/core/config\.py)$
      - id: requirements-sync
        name: requirements files match poetry.lock
        entry: poetry run python scripts/check_requirements_sync.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock|requirements(-dev)?\.txt)$
      # - id: pytest
      #   name: pytest
      #   entry: poetry run pytest
      #   language: system
      #   pass_filenames: false
      #   always_run: true
      #   stages: [pre-push]
