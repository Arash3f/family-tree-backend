[tool.poetry]
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[project]
name = "family-tree-backend"
version = "0.1.0"
description = "Family tree backend base on FastApi"
authors = [
    {name = "arash alfooneh",email = "arash.alfooneh@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "jdatetime (>=5.2.0,<6.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "swagger-ui-bundle (>=1.1.0,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.27,<0.0.28)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "neo4j (>=6.2.0,<7.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "neo4j-backup (>=1.0.0,<2.0.0)",
    "strawberry-graphql[fastapi] (>=0.323.0,<0.324.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "redis (>=5.0.0,<7.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    "migrations",
    "build",
    "dist",
    "**/models/__init__.py",
]

[tool.ruff.lint]
# Beyond pyflakes/pycodestyle defaults: import order, modern-syntax upgrades,
# obvious simplifications, and comprehension cleanups. Deliberately excludes
# flake8-bugbear (B008 false-positives on FastAPI's `Depends(...)` default
# args) and RUF001 (flags this codebase's intentional Persian/Farsi strings
# as "ambiguous" Unicode).
select = ["E", "F", "I", "UP", "SIM", "C4"]

[tool.mypy]
plugins = ["strawberry.ext.mypy_plugin"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = "(?x)(^migrations/|^scripts/|^build/|^dist/)"

[tool.bandit]
exclude_dirs = ["tests", "migrations", "bruno", "scripts"]
skips = ["B101"]

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "commitizen (>=4.13.10,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]
