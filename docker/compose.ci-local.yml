# Local overrides to avoid host port conflicts when simulating CI.
#
# From repo root:
#   docker compose -f docker/compose.full.yml -f docker/compose.ci-local.yml --env-file .env up --build

services:
  db:
    ports: !override
      - "15432:5432"
  redis:
    ports: !override
      - "16379:6379"
  neo4j:
    ports: !override
      - "17474:7474"
      - "17687:7687"
