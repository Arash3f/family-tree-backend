# Optional host port publishes for local tooling (psql, Neo4j Browser, MinIO console).
#
# From repository root:
#   docker compose -f docker/compose.yml -f docker/compose.host-ports.yml --env-file .env up -d

services:
  db:
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"

  neo4j:
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
