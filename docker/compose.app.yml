# App-only stack: API + Celery + Flower
# Expects Postgres, Redis, and Neo4j on the host (or reachable via overrides).
#
# From repo root:
#   docker compose -f docker/compose.app.yml --env-file .env up --build
#
# Defaults connect to host.docker.internal. Override if needed:
#   POSTGRES_HOST=... CELERY_BROKER_URL=... NEO4J_URI=...

name: family-tree-app

x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile

x-app-common: &app-common
  build: *app-build
  image: family-tree-api:local
  env_file:
    - ../.env
  environment:
    # App-only defaults to the host; ignore Docker DNS names from .env (db/redis/neo4j).
    POSTGRES_HOST: ${APP_POSTGRES_HOST:-host.docker.internal}
    POSTGRES_HOST_TEST: ${APP_POSTGRES_HOST_TEST:-host.docker.internal}
    CELERY_BROKER_URL: ${APP_CELERY_BROKER_URL:-redis://host.docker.internal:6379/0}
    CELERY_RESULT_BACKEND: ${APP_CELERY_RESULT_BACKEND:-redis://host.docker.internal:6379/1}
    NEO4J_URI: ${APP_NEO4J_URI:-bolt://host.docker.internal:7687}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - family-tree-app

services:
  api:
    <<: *app-common
    container_name: family-tree-app-api
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "${API_PORT:-8001}:8001"

  celery_worker:
    <<: *app-common
    container_name: family-tree-app-celery-worker
    user: "0:0"
    command: >
      celery -A app.celery.celery_app worker --loglevel=info
      -Q celery,sync_person,sync_relationship,backup_database
    volumes:
      - backup_data:/mnt/backups
    healthcheck:
      disable: true

  celery_beat:
    <<: *app-common
    container_name: family-tree-app-celery-beat
    user: "0:0"
    command: celery -A app.celery.celery_app beat --loglevel=info
    volumes:
      - celerybeat_data:/app/celerybeat
      - backup_data:/mnt/backups
    healthcheck:
      disable: true

  flower:
    <<: *app-common
    container_name: family-tree-app-flower
    command: >
      sh -c "celery -A app.celery.celery_app flower --port=5555
      --basic_auth=$${FLOWER_BASIC_AUTH:-admin:admin}"
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5555/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  family-tree-app:
    name: family-tree-app-net
    driver: bridge

volumes:
  celerybeat_data:
  backup_data:
