# Optional overlay: attach app-only services to the full-stack infra network.
# Use when Postgres/Redis/Neo4j were started via compose.full.yml.
#
# From repo root:
#   docker compose -f docker/compose.full.yml --env-file .env up -d db redis neo4j
#   docker compose -f docker/compose.app.yml -f docker/compose.app.with-infra.yml --env-file .env up --build
#
# Also set (shell or .env):
#   APP_POSTGRES_HOST=db
#   APP_CELERY_BROKER_URL=redis://redis:6379/0
#   APP_CELERY_RESULT_BACKEND=redis://redis:6379/1
#   APP_NEO4J_URI=bolt://neo4j:7687

services:
  api:
    networks:
      - family-tree-app
      - infra
  celery_worker:
    networks:
      - family-tree-app
      - infra
  celery_beat:
    networks:
      - family-tree-app
      - infra
  flower:
    networks:
      - family-tree-app
      - infra

networks:
  infra:
    name: ${INFRA_NETWORK:-family-tree-net}
    external: true
