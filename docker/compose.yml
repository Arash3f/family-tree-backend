# Full stack: API + Celery + Postgres + Redis + Neo4j + MinIO
#
# From backend repo root:
#   docker compose -f docker/compose.yml --env-file .env up --build

name: family-tree

# Defaults to the lean production image. Set APP_IMAGE_TARGET=ci to get the
# variant that also carries pytest and the linters, which is what runs the test
# suite in CI and locally.
x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile
  target: ${APP_IMAGE_TARGET:-runtime}

x-app-env: &app-env
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - family-tree

services:
  api:
    <<: *app-env
    build: *app-build
    image: "family-tree-api:${APP_IMAGE_TARGET:-runtime}"
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    <<: *app-env
    build: *app-build
    image: "family-tree-api:${APP_IMAGE_TARGET:-runtime}"
    command: >
      celery -A app.celery.celery_app worker --loglevel=info
      -Q celery,sync_person,sync_relationship,backup_database,reconcile_neo4j
    volumes:
      - backup_data:/mnt/backups
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # Override image HEALTHCHECK (uvicorn /health); worker is not an HTTP server.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *app-env
    build: *app-build
    image: "family-tree-api:${APP_IMAGE_TARGET:-runtime}"
    command: celery -A app.celery.celery_app beat --loglevel=info
    volumes:
      - celerybeat_data:/app/celerybeat
      - backup_data:/mnt/backups
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Postgres/Redis via AWS Public ECR (Docker Hub library mirror) so CI and
  # shared runners are not blocked by anonymous Docker Hub pull rate limits.
  # Neo4j via Google's Docker Hub mirror for the same reason; MinIO is on quay.io.
  db:
    image: public.ecr.aws/docker/library/postgres:15.13
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - family-tree
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: public.ecr.aws/docker/library/redis:8.2.1
    restart: unless-stopped
    networks:
      - family-tree
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: ${NEO4J_IMAGE:-mirror.gcr.io/neo4j:5.26.4}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      # Keep Neo4j lean on small VPS hosts (≈4GiB). Defaults otherwise grab
      # hundreds of MiB of pagecache and push Java into swap.
      NEO4J_server_memory_pagecache_size: 192M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 384M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/import
    networks:
      - family-tree
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - family-tree
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  family-tree:
    # Stable name so the frontend container can join with --network family-tree-net.
    name: family-tree-net
    driver: bridge

volumes:
  postgres_data:
  celerybeat_data:
  backup_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
  minio_data:
