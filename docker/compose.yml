# Full stack: API + Celery + Postgres + Redis + Neo4j + MinIO
#
# From backend repo root:
#   docker compose -f docker/compose.yml --env-file .env up --build

name: family-tree

# Defaults to the lean production image. Set APP_IMAGE_TARGET=ci to get the
# variant that also carries pytest and the linters, which is what runs the test
# suite in CI and locally.
x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile
  target: ${APP_IMAGE_TARGET:-runtime}

x-app-env: &app-env
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - family-tree

services:
  api:
    <<: *app-env
    build: *app-build
    image: "family-tree-api:${APP_IMAGE_TARGET:-runtime}"
    container_name: family-tree-api
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    <<: *app-env
    build: *app-build
    image: "family-tree-api:${APP_IMAGE_TARGET:-runtime}"
    container_name: family-tree-celery-worker
    command: >
      celery -A app.celery.celery_app worker --loglevel=info
      -Q celery,sync_person,sync_relationship,backup_database,reconcile_neo4j
    volumes:
      - backup_data:/mnt/backups
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # Override image HEALTHCHECK (uvicorn /health); worker is not an HTTP server.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *app-env
    build: *app-build
    image: "family-tree-api:${APP_IMAGE_TARGET:-runtime}"
    container_name: family-tree-celery-beat
    command: celery -A app.celery.celery_app beat --loglevel=info
    volumes:
      - celerybeat_data:/app/celerybeat
      - backup_data:/mnt/backups
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:15.13
    container_name: family-tree-db
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - family-tree
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2.1
    container_name: family-tree-redis
    restart: unless-stopped
    networks:
      - family-tree
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26.4
    container_name: family-tree-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/import
    networks:
      - family-tree
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: family-tree-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - family-tree
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  family-tree:
    name: family-tree-net
    driver: bridge

volumes:
  postgres_data:
  celerybeat_data:
  backup_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
  minio_data:
