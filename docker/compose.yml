# Full stack: API + Celery + Flower + Postgres + Redis + Neo4j
#
# From backend repo root:
#   docker compose -f docker/compose.yml --env-file .env up --build

name: family-tree

x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile

x-app-env: &app-env
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - family-tree

services:
  api:
    <<: *app-env
    build: *app-build
    image: family-tree-api:local
    container_name: family-tree-api
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  celery_worker:
    <<: *app-env
    build: *app-build
    image: family-tree-api:local
    container_name: family-tree-celery-worker
    user: "0:0"
    command: >
      celery -A app.celery.celery_app worker --loglevel=info
      -Q celery,sync_person,sync_relationship,backup_database
    volumes:
      - backup_data:/mnt/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # Override image HEALTHCHECK (uvicorn /health); worker is not an HTTP server.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *app-env
    build: *app-build
    image: family-tree-api:local
    container_name: family-tree-celery-beat
    user: "0:0"
    command: celery -A app.celery.celery_app beat --loglevel=info
    volumes:
      - celerybeat_data:/app/celerybeat
      - backup_data:/mnt/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  flower:
    <<: *app-env
    build: *app-build
    image: family-tree-api:local
    container_name: family-tree-flower
    command: >
      sh -c "celery -A app.celery.celery_app flower --port=5555
      --basic_auth=$${FLOWER_BASIC_AUTH:-admin:admin}"
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"$${FLOWER_BASIC_AUTH:-admin:admin}\" http://127.0.0.1:5555/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:15
    container_name: family-tree-db
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - family-tree
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8
    container_name: family-tree-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - family-tree
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: family-tree-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/import
    networks:
      - family-tree
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  family-tree:
    name: family-tree-net
    driver: bridge

volumes:
  postgres_data:
  celerybeat_data:
  backup_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
