name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMPOSE_PROJECT_NAME: ci_${{ github.run_id }}
  COMPOSE_FILE: docker/compose.yml

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Bandit
        run: bandit -r app -ll

      - name: Install Poetry + export plugin
        run: |
          python -m pip install "poetry>=2.0,<3.0"
          poetry self add poetry-plugin-export

      - name: Check requirements.txt sync
        run: python scripts/check_requirements_sync.py

  stack:
    name: Docker stack & tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Create environment
        run: cp .env.example .env

      - name: Build images
        run: docker compose --env-file .env build

      - name: Start stack
        # api + its depends_on (db, redis, neo4j). Celery/Flower not needed for pytest.
        run: docker compose --env-file .env up -d --wait --wait-timeout 180 api

      - name: Create test database
        run: |
          DB_USER="$(grep '^POSTGRES_USER=' .env | cut -d '=' -f2)"
          DB_TEST="$(grep '^POSTGRES_DB_TEST=' .env | cut -d '=' -f2)"
          docker compose --env-file .env exec -T db psql -U "$DB_USER" -tc \
            "SELECT 1 FROM pg_database WHERE datname = '${DB_TEST}'" | grep -q 1 \
          || docker compose --env-file .env exec -T db psql -U "$DB_USER" -c "CREATE DATABASE ${DB_TEST}"

      - name: Run tests
        run: |
          docker compose --env-file .env exec -T api sh -c '
            export COVERAGE_FILE=/tmp/.coverage
            pytest -v --tb=short \
              --junitxml=/tmp/pytest.xml \
              --cov=app \
              --cov-report=xml:/tmp/coverage.xml \
              --cov-report=term \
              --cov-fail-under=50 \
              -o cache_dir=/tmp/pytest_cache
          '

      - name: Collect test artifacts
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --env-file .env cp api:/tmp/pytest.xml artifacts/pytest.xml || true
          docker compose --env-file .env cp api:/tmp/coverage.xml artifacts/coverage.xml || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose --env-file .env ps
          docker compose --env-file .env logs --tail=100 api db redis neo4j minio minio-init

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans
