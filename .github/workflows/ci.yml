name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: ci_${{ github.run_id }}
  COMPOSE_FILE: docker/compose.yml

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # AppSettings validates on import, so the sync check needs an env file.
      - name: Create environment
        run: cp .env.example .env

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Bandit
        run: bandit -r app -c pyproject.toml -ll

      - name: Check .env.example sync
        run: python scripts/check_env_example_sync.py

      - name: Validate Compose files
        run: |
          docker compose --env-file .env config -q
          docker compose --env-file .env -f docker/compose.yml -f docker/compose.host-ports.yml config -q

      - name: Install Poetry + export plugin
        run: |
          python -m pip install "poetry>=2.0,<3.0"
          poetry self add poetry-plugin-export

      - name: Check requirements sync
        run: python scripts/check_requirements_sync.py

  stack:
    name: Docker stack & tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    env:
      # Compose defaults to the production image; the suite needs the test tooling.
      APP_IMAGE_TARGET: ci
    steps:
      - uses: actions/checkout@v4

      - name: Create environment
        run: cp .env.example .env

      - name: Build images
        run: docker compose --env-file .env build

      # The ci image is built on top of runtime, so this reuses cached layers.
      - name: Production image is importable and free of test tooling
        run: |
          docker build -f docker/Dockerfile --target runtime -t family-tree-api:runtime-check .
          docker run --rm --env-file .env --entrypoint python family-tree-api:runtime-check -c 'import app.main'
          if docker run --rm --entrypoint sh family-tree-api:runtime-check -c 'command -v pytest'; then
            echo "::error::the runtime image ships pytest; it must stay production-only"
            exit 1
          fi

      - name: Start stack
        # api + its depends_on (db, redis, neo4j, minio). Celery/Flower not needed for pytest.
        run: docker compose --env-file .env up -d --wait --wait-timeout 180 api

      - name: Alembic migration smoke
        run: |
          docker compose --env-file .env exec -T api alembic current
          docker compose --env-file .env exec -T api alembic heads
          # App DB is migrated by entrypoint; assert version table exists and matches head.
          docker compose --env-file .env exec -T api sh -c '
            current="$(alembic current 2>/dev/null | awk "{print \$1}" | head -n1)"
            head="$(alembic heads 2>/dev/null | awk "{print \$1}" | head -n1)"
            test -n "$current" && test "$current" = "$head"
          '

      # - name: Create test database
