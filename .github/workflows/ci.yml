      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose --env-file .env ps
          docker compose --env-file .env logs --tail=100 api db redis neo4j minio

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans
