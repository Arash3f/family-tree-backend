[tool.poetry]
name = "family-tree-graphql-client"
version = "0.1.0"
description = "A client library for accessing the Family Tree GraphQL API"
authors = []
packages = [
    { include = "family_tree_graphql_client" },
]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
pydantic = ">=2.0.0,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
