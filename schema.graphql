enum AccountTypeEnum {
  FREE
  PAID
}

type AuthTokensType {
  accessToken: String!
  refreshToken: String!
  tokenType: String!
}

type ClosestRelationshipType {
  fromPersonId: UUID!
  toPersonId: UUID!
  found: Boolean!
  distance: Int
  pathPersonIds: [UUID!]!
  relationshipTypes: [String!]!
}

"""Date (isoformat)"""
scalar Date

input DateRangeInput {
  min: Date = null
  max: Date = null
}

"""Date with time (isoformat)"""
scalar DateTime

input DivorceInput {
  marriageId: UUID!
  divorcedAt: Date!
}

input FamilyTreeCreateInput {
  name: String!
}

type FamilyTreeType {
  id: UUID!
  name: String!
  ownerUserId: UUID!
  myPermissions: [String!]!
}

input FamilyTreeUpdateInput {
  name: String!
}

enum Gender {
  MALE
  FEMALE
}

input MarriageCreateInput {
  spouseAId: UUID!
  spouseBId: UUID!
  marriedAt: Date!
}

input MarriageFilterInput {
  id: UUID = null
  spouseAId: UUID = null
  spouseBId: UUID = null
  marriedAt: DateRangeInput = null
  divorcedAt: DateRangeInput = null
}

input MarriageListInput {
  pagination: PaginationInput = null
  filters: MarriageFilterInput = null
  sortOrder: SortOrder = null
  sortBy: MarriageSortBy = null
}

type MarriagePage {
  items: [MarriageType!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

enum MarriageSortBy {
  ID
  MARRIED_AT
  DIVORCED_AT
}

type MarriageType {
  id: UUID
  spouseAId: UUID!
  spouseBId: UUID!
  marriedAt: Date
  divorcedAt: Date
}

input MarriageUpdateDataInput {
  spouseAId: UUID = null
  spouseBId: UUID = null
  marriedAt: Date = null
  divorcedAt: Date = null
}

input MarriageUpdateInput {
  data: MarriageUpdateDataInput!
  where: MarriageUpdateWhereInput!
}

input MarriageUpdateWhereInput {
  marriageId: UUID!
}

type Mutation {
  """Login (REST: POST /auth/login)"""
  login(username: String!, password: String!): AuthTokensType!

  """Refresh tokens (REST: POST /auth/refresh)"""
  refreshToken(refreshToken: String!): AuthTokensType!

  """Logout current session (REST: POST /auth/logout)"""
  logout: ResultType!

  """Logout all sessions (REST: POST /auth/logout-all)"""
  logoutAll: ResultType!

  """Create family tree (REST: POST /family-trees)"""
  createFamilyTree(data: FamilyTreeCreateInput!): FamilyTreeType!

  """Update family tree (REST: PATCH /family-trees/{id})"""
  updateFamilyTree(treeId: UUID!, data: FamilyTreeUpdateInput!): FamilyTreeType!

  """Delete family tree (REST: DELETE /family-trees/{id})"""
  deleteFamilyTree(treeId: UUID!): ResultType!

  """Add tree member (REST: POST /family-trees/{id}/members)"""
  addTreeMember(treeId: UUID!, data: TreeMemberAddInput!): TreeMembershipType!

  """
  Update tree member access (REST: PATCH /family-trees/{id}/members/{user_id})
  """
  updateTreeMember(treeId: UUID!, userId: UUID!, data: TreeMemberUpdateInput!): TreeMembershipType!

  """Remove tree member (REST: DELETE /family-trees/{id}/members/{user_id})"""
  removeTreeMember(treeId: UUID!, userId: UUID!): ResultType!

  """Create person (REST: POST /family-trees/{tree_id}/persons)"""
  createPerson(treeId: UUID!, data: PersonCreateInput!): PersonType!

  """Update person (REST: PUT /family-trees/{tree_id}/persons/)"""
  updatePerson(treeId: UUID!, data: PersonUpdateInput!): PersonType!

  """Delete person (REST: DELETE /family-trees/{tree_id}/persons/{id})"""
  deletePerson(treeId: UUID!, personId: UUID!): ResultType!

  """Create user (REST: POST /users)"""
  createUser(data: UserCreateInput!): UserType!

  """Update user (REST: PUT /users)"""
  updateUser(data: UserUpdateInput!): UserType!

  """Delete user (REST: DELETE /users/{id})"""
  deleteUser(userId: UUID!): ResultType!

  """Create role (REST: POST /roles)"""
  createRole(data: RoleCreateInput!): RoleType!

  """Update role (REST: PUT /roles)"""
  updateRole(data: RoleUpdateInput!): RoleType!

  """Delete role (REST: DELETE /roles/{id})"""
  deleteRole(roleId: UUID!): ResultType!

  """Create marriage (REST: POST /family-trees/{tree_id}/marriages)"""
  createMarriage(treeId: UUID!, data: MarriageCreateInput!): MarriageType!

  """Update marriage (REST: PUT /family-trees/{tree_id}/marriages/)"""
  updateMarriage(treeId: UUID!, data: MarriageUpdateInput!): MarriageType!

  """Delete marriage (REST: DELETE /family-trees/{tree_id}/marriages/)"""
  deleteMarriage(treeId: UUID!, marriageId: UUID!): ResultType!

  """Divorce (REST: POST /family-trees/{tree_id}/marriages/divorce)"""
  divorce(treeId: UUID!, data: DivorceInput!): ResultType!

  """Create ticket (REST: POST /tickets)"""
  createTicket(data: TicketCreateInput!): TicketType!

  """Add ticket message (REST: POST /tickets/{id}/messages)"""
  addTicketMessage(ticketId: UUID!, data: TicketMessageCreateInput!): TicketMessageType!

  """Update ticket status (REST: PATCH /tickets/{id}/status)"""
  updateTicketStatus(ticketId: UUID!, data: TicketUpdateStatusInput!): TicketSummaryType!
}

input PaginationInput {
  page: Int! = 1
  pageSize: Int! = 30
  offset: Int! = 0
}

input ParentLinkInput {
  parentId: UUID!
  relationshipType: ParentRelationshipType! = BIOLOGICAL
}

type ParentLinkType {
  parentId: UUID!
  relationshipType: ParentRelationshipType!
}

enum ParentRelationshipType {
  BIOLOGICAL
  ADOPTIVE
  STEP
}

