}

type Query {
  """Current authenticated user (REST: GET /auth/me)"""
  me: UserType!

  """List family trees for current user (REST: GET /family-trees)"""
  familyTrees: [FamilyTreeType!]!

  """Get family tree by id (REST: GET /family-trees/{id})"""
  familyTree(treeId: UUID!): FamilyTreeType!

  """List tree members (REST: GET /family-trees/{id}/members)"""
  treeMembers(treeId: UUID!): [TreeMembershipType!]!

  """Get person by id (REST: GET /family-trees/{tree_id}/persons/{id})"""
  person(treeId: UUID!, personId: UUID!): PersonType!

  """Filtered person list (REST: POST /family-trees/{tree_id}/persons/list)"""
  persons(treeId: UUID!, data: PersonListInput = null): PersonPage!

  """
  Closest relationship path (REST: GET /family-trees/{tree_id}/persons/{from}/relation/{to})
  """
  closestRelationship(treeId: UUID!, fromPersonId: UUID!, toPersonId: UUID!): ClosestRelationshipType!

  """Get user by id (REST: GET /users/{id})"""
  user(userId: UUID!): UserType!

  """Filtered user list (REST: POST /users/list)"""
  users(data: UserListInput = null): UserPage!

  """Get role by id (REST: GET /roles/{id})"""
  role(roleId: UUID!): RoleType!

  """Filtered role list (REST: POST /roles/list)"""
  roles(data: RoleListInput = null): RolePage!

  """Filtered permission list (REST: POST /permissions/list)"""
  permissions(data: PermissionListInput = null): PermissionPage!

  """Get marriage by id (REST: GET /family-trees/{tree_id}/marriages/{id})"""
  marriage(treeId: UUID!, marriageId: UUID!): MarriageType!

  """
  Filtered marriage list (REST: POST /family-trees/{tree_id}/marriages/list)
  """
  marriages(treeId: UUID!, data: MarriageListInput = null): MarriagePage!

  """Get ticket by id (REST: GET /tickets/{id})"""
  ticket(ticketId: UUID!): TicketType!

  """Filtered ticket list (REST: POST /tickets/list)"""
  tickets(data: TicketListInput = null): TicketPage!
}

